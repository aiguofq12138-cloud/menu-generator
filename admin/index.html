<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营后台 - 基础数据管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; padding: 20px; max-width: 900px; margin: auto; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .btn { padding: 8px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .status { margin-top: 8px; font-size: 14px; padding: 6px 12px; border-radius: 6px; }
        .status.success { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .json-preview { background: #f3f4f6; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
        hr { margin: 20px 0; border: 0; border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>

    <h1>⚙️ 运营后台 · 基础数据管理</h1>

    <!-- 配置区域 -->
    <div class="card">
        <div class="card-title">🔐 GitHub 配置</div>
        <div class="flex" style="flex-wrap:wrap; gap:10px;">
            <div style="flex:1;min-width:150px;">
                <label>Owner（用户名）</label>
                <input type="text" id="owner" value="" placeholder="你的GitHub用户名">
            </div>
            <div style="flex:1;min-width:150px;">
                <label>Repo（仓库名）</label>
                <input type="text" id="repo" value="" placeholder="你的仓库名">
            </div>
            <div style="flex:1;min-width:200px;">
                <label>Token（classic）</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxx" style="width:100%;">
            </div>
            <div style="display:flex;align-items:flex-end;gap:8px;">
                <button class="btn btn-secondary" onclick="saveConfig()">保存配置</button>
                <button class="btn btn-secondary" onclick="loadConfig()">加载配置</button>
            </div>
        </div>
        <div id="configStatus" class="status" style="display:none;"></div>
        <div style="margin-top:8px;font-size:12px;color:#6b7280;">
            ⚠️ Token 需要 <code>repo</code> 或 <code>public_repo</code> 权限，配置保存在浏览器本地。
        </div>
    </div>

    <!-- 管理菜谱 -->
    <div class="card">
        <div class="card-title">📝 管理系统菜谱（recipes.json）</div>
        <div class="flex" style="margin-bottom:10px;">
            <button class="btn btn-primary" onclick="loadRecipes()">📥 加载当前菜谱</button>
            <button class="btn btn-success" onclick="saveRecipes()">💾 保存菜谱</button>
        </div>
        <div id="recipesStatus" class="status" style="display:none;"></div>

        <div class="form-group">
            <label>新增菜谱（一行一个）</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" id="newRecipeName" placeholder="菜谱名称" style="flex:2;min-width:120px;">
                <input type="text" id="newRecipeCat" placeholder="分类" style="flex:1;min-width:80px;">
                <input type="text" id="newRecipeTime" placeholder="时间" style="flex:1;min-width:80px;">
                <button class="btn btn-primary" onclick="addRecipe()">➕ 添加</button>
            </div>
        </div>

        <div id="recipeListContainer">
            <p style="color:#6b7280;font-size:14px;">点击“加载当前菜谱”查看列表</p>
        </div>
    </div>

    <!-- 管理食材 -->
    <div class="card">
        <div class="card-title">🥬 管理系统食材（system-ingredients.json）</div>
        <div class="flex" style="margin-bottom:10px;">
            <button class="btn btn-primary" onclick="loadIngredients()">📥 加载当前食材</button>
            <button class="btn btn-success" onclick="saveIngredients()">💾 保存食材</button>
        </div>
        <div id="ingredientsStatus" class="status" style="display:none;"></div>

        <div class="form-group">
            <label>新增食材</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input type="text" id="newIngName" placeholder="食材名称" style="flex:2;min-width:120px;">
                <input type="text" id="newIngCat" placeholder="分类" style="flex:1;min-width:80px;">
                <input type="text" id="newIngUnit" placeholder="单位" value="g" style="flex:1;min-width:60px;">
                <button class="btn btn-primary" onclick="addIngredient()">➕ 添加</button>
            </div>
        </div>

        <div id="ingredientListContainer">
            <p style="color:#6b7280;font-size:14px;">点击“加载当前食材”查看列表</p>
        </div>
    </div>

    <!-- 其他数据（可选） -->
    <div class="card">
        <div class="card-title">🔧 其他数据文件</div>
        <div class="flex">
            <button class="btn btn-secondary" onclick="loadOtherData()">加载所有数据</button>
        </div>
        <div id="otherDataContainer" style="margin-top:8px;font-size:13px;"></div>
    </div>

    <script>
        // ============ 配置 ============
        let CONFIG = {
            owner: '',
            repo: '',
            token: ''
        };

        // 加载本地配置
        function loadConfig() {
            const saved = localStorage.getItem('admin_github_config');
            if (saved) {
                try {
                    const cfg = JSON.parse(saved);
                    document.getElementById('owner').value = cfg.owner || '';
                    document.getElementById('repo').value = cfg.repo || '';
                    document.getElementById('token').value = cfg.token || '';
                    CONFIG = cfg;
                    showStatus('configStatus', '配置已加载 ✅', 'success');
                } catch(e) { /* ignore */ }
            }
        }

        function saveConfig() {
            CONFIG.owner = document.getElementById('owner').value.trim();
            CONFIG.repo = document.getElementById('repo').value.trim();
            CONFIG.token = document.getElementById('token').value.trim();
            if (!CONFIG.owner || !CONFIG.repo || !CONFIG.token) {
                alert('请填写完整信息');
                return;
            }
            localStorage.setItem('admin_github_config', JSON.stringify(CONFIG));
            showStatus('configStatus', '配置已保存 ✅', 'success');
        }

        function getConfig() {
            // 优先从输入框获取最新值
            CONFIG.owner = document.getElementById('owner').value.trim();
            CONFIG.repo = document.getElementById('repo').value.trim();
            CONFIG.token = document.getElementById('token').value.trim();
            if (!CONFIG.owner || !CONFIG.repo || !CONFIG.token) {
                alert('请先配置 GitHub 信息');
                return null;
            }
            return CONFIG;
        }

        // ============ GitHub API 操作 ============
        async function readGitHubFile(path) {
            const cfg = getConfig();
            if (!cfg) throw new Error('配置无效');
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
            const res = await fetch(url, {
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (!res.ok) {
                if (res.status === 404) return null; // 文件不存在
                throw new Error(`读取失败 (${res.status}): ${res.statusText}`);
            }
            const data = await res.json();
            const binary = atob(data.content);
const bytes = new Uint8Array(binary.length);
for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
}
const content = new TextDecoder('utf-8').decode(bytes);
return { content: JSON.parse(content), sha: data.sha };
        }

        async function writeGitHubFile(path, jsonData, sha) {
            const cfg = getConfig();
            if (!cfg) throw new Error('配置无效');
            const jsonString = JSON.stringify(jsonData, null, 2);
const utf8Bytes = new TextEncoder().encode(jsonString);
let binary = '';
for (let i = 0; i < utf8Bytes.length; i++) {
    binary += String.fromCharCode(utf8Bytes[i]);
}
const content = btoa(binary);
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `运营后台更新: ${path}`,
                    content: content,
                    sha: sha
                })
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(`写入失败 (${res.status}): ${err.message || res.statusText}`);
            }
            return res.json();
        }

        // ============ 菜谱管理 ============
        let currentRecipes = [];
        let currentRecipesSha = null;

        async function loadRecipes() {
            const status = document.getElementById('recipesStatus');
            status.style.display = 'block';
            status.className = 'status';
            status.textContent = '⏳ 加载中...';
            try {
                const result = await readGitHubFile('data/recipes.json');
                if (!result) {
                    currentRecipes = [];
                    currentRecipesSha = null;
                    status.textContent = '⚠️ 文件不存在，将新建';
                    status.className = 'status error';
                } else {
                    currentRecipes = result.content;
                    currentRecipesSha = result.sha;
                    status.textContent = `✅ 加载成功，共 ${currentRecipes.length} 个菜谱`;
                    status.className = 'status success';
                }
                renderRecipeList();
            } catch (err) {
                status.textContent = `❌ 加载失败: ${err.message}`;
                status.className = 'status error';
            }
        }

        function renderRecipeList() {
            const container = document.getElementById('recipeListContainer');
            if (!currentRecipes || currentRecipes.length === 0) {
                container.innerHTML = '<p style="color:#6b7280;">暂无菜谱</p>';
                return;
            }
            let html = '<ul style="list-style:none;padding:0;">';
            currentRecipes.forEach((r, idx) => {
                html += `<li style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e5e7eb;">
                    <span><strong>${r.name}</strong> (${r.category}) ${r.time}</span>
                    <button class="btn btn-danger btn-sm" onclick="deleteRecipe(${idx})">删除</button>
                </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function addRecipe() {
            const name = document.getElementById('newRecipeName').value.trim();
            const category = document.getElementById('newRecipeCat').value.trim();
            const time = document.getElementById('newRecipeTime').value.trim();
            if (!name || !category || !time) {
                alert('请完整填写菜谱信息');
                return;
            }
            if (!currentRecipes) currentRecipes = [];
            currentRecipes.push({
                name: name,
                category: category,
                difficulty: '中等',
                time: time,
                ingredients: [{ name: '示例食材', grams: 100 }],
                steps: ['步骤1', '步骤2']
            });
            renderRecipeList();
            document.getElementById('newRecipeName').value = '';
            document.getElementById('newRecipeCat').value = '';
            document.getElementById('newRecipeTime').value = '';
            document.getElementById('recipesStatus').textContent = '📝 已添加，点击“保存菜谱”提交到 GitHub';
            document.getElementById('recipesStatus').className = 'status';
        }

        function deleteRecipe(idx) {
            if (!confirm('确定删除这个菜谱吗？')) return;
            currentRecipes.splice(idx, 1);
            renderRecipeList();
            document.getElementById('recipesStatus').textContent = '🗑️ 已删除，点击“保存菜谱”提交更改';
            document.getElementById('recipesStatus').className = 'status';
        }

        async function saveRecipes() {
            const status = document.getElementById('recipesStatus');
            status.style.display = 'block';
            status.className = 'status';
            status.textContent = '⏳ 保存中...';
            try {
                if (!currentRecipes) currentRecipes = [];
                // 如果文件原本不存在，sha 为 null，PUT 时自动创建
                const result = await writeGitHubFile('data/recipes.json', currentRecipes, currentRecipesSha);
                // 更新 sha
                currentRecipesSha = result.content.sha;
                status.textContent = '✅ 保存成功！GitHub Pages 将在 1-2 分钟后更新';
                status.className = 'status success';
            } catch (err) {
                status.textContent = `❌ 保存失败: ${err.message}`;
                status.className = 'status error';
            }
        }

        // ============ 食材管理 ============
        let currentIngredients = [];
        let currentIngredientsSha = null;

        async function loadIngredients() {
            const status = document.getElementById('ingredientsStatus');
            status.style.display = 'block';
            status.className = 'status';
            status.textContent = '⏳ 加载中...';
            try {
                const result = await readGitHubFile('data/system-ingredients.json');
                if (!result) {
                    currentIngredients = [];
                    currentIngredientsSha = null;
                    status.textContent = '⚠️ 文件不存在，将新建';
                    status.className = 'status error';
                } else {
                    currentIngredients = result.content;
                    currentIngredientsSha = result.sha;
                    status.textContent = `✅ 加载成功，共 ${currentIngredients.length} 个食材`;
                    status.className = 'status success';
                }
                renderIngredientList();
            } catch (err) {
                status.textContent = `❌ 加载失败: ${err.message}`;
                status.className = 'status error';
            }
        }

        function renderIngredientList() {
            const container = document.getElementById('ingredientListContainer');
            if (!currentIngredients || currentIngredients.length === 0) {
                container.innerHTML = '<p style="color:#6b7280;">暂无食材</p>';
                return;
            }
            let html = '<ul style="list-style:none;padding:0;">';
            currentIngredients.forEach((item, idx) => {
                html += `<li style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e5e7eb;">
                    <span><strong>${item.name}</strong> (${item.category}) 单位: ${item.unit}</span>
                    <button class="btn btn-danger btn-sm" onclick="deleteIngredient(${idx})">删除</button>
                </li>`;
            });
            html += '</ul>';
            container.innerHTML = html;
        }

        function addIngredient() {
            const name = document.getElementById('newIngName').value.trim();
            const category = document.getElementById('newIngCat').value.trim();
            const unit = document.getElementById('newIngUnit').value.trim() || 'g';
            if (!name || !category) {
                alert('请完整填写食材信息');
                return;
            }
            if (!currentIngredients) currentIngredients = [];
            // 简单去重
            if (currentIngredients.some(i => i.name === name)) {
                alert('该食材已存在，请勿重复添加');
                return;
            }
            currentIngredients.push({ name, category, unit });
            renderIngredientList();
            document.getElementById('newIngName').value = '';
            document.getElementById('newIngCat').value = '';
            document.getElementById('newIngUnit').value = 'g';
            document.getElementById('ingredientsStatus').textContent = '📝 已添加，点击“保存食材”提交到 GitHub';
            document.getElementById('ingredientsStatus').className = 'status';
        }

        function deleteIngredient(idx) {
            if (!confirm('确定删除这个食材吗？')) return;
            currentIngredients.splice(idx, 1);
            renderIngredientList();
            document.getElementById('ingredientsStatus').textContent = '🗑️ 已删除，点击“保存食材”提交更改';
            document.getElementById('ingredientsStatus').className = 'status';
        }

        async function saveIngredients() {
            const status = document.getElementById('ingredientsStatus');
            status.style.display = 'block';
            status.className = 'status';
            status.textContent = '⏳ 保存中...';
            try {
                if (!currentIngredients) currentIngredients = [];
                const result = await writeGitHubFile('data/system-ingredients.json', currentIngredients, currentIngredientsSha);
                currentIngredientsSha = result.content.sha;
                status.textContent = '✅ 保存成功！GitHub Pages 将在 1-2 分钟后更新';
                status.className = 'status success';
            } catch (err) {
                status.textContent = `❌ 保存失败: ${err.message}`;
                status.className = 'status error';
            }
        }

        // ============ 其他数据预览 ============
        async function loadOtherData() {
            const container = document.getElementById('otherDataContainer');
            container.innerHTML = '⏳ 加载中...';
            try {
                const files = ['categories.json', 'calorie-table.json', 'nutrition-table.json', 'category-defaults.json', 'ingredient-units.json'];
                let html = '';
                for (const f of files) {
                    const result = await readGitHubFile(`data/${f}`);
                    if (result) {
                        html += `<div><strong>${f}</strong> (存在)</div>`;
                    } else {
                        html += `<div><strong>${f}</strong> <span style="color:#dc2626;">不存在</span></div>`;
                    }
                }
                container.innerHTML = html || '无其他数据';
            } catch (err) {
                container.innerHTML = `❌ ${err.message}`;
            }
        }

        // ============ 工具 ============
        function showStatus(id, msg, type) {
            const el = document.getElementById(id);
            if (el) {
                el.textContent = msg;
                el.className = `status ${type}`;
                el.style.display = 'block';
            }
        }

        // 页面加载时自动加载配置
        window.onload = function() {
            loadConfig();
            // 自动加载菜谱和食材
            loadRecipes();
            loadIngredients();
        };
    </script>
</body>
</html>

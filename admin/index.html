<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #0f172a; color: #cbd5e1; padding: 20px 0; flex-shrink: 0; display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
        .sidebar .brand { font-size: 20px; font-weight: 700; color: white; padding: 0 20px 24px 20px; border-bottom: 1px solid #1e293b; margin-bottom: 12px; }
        .sidebar .menu-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; color: #94a3b8; transition: 0.15s; border-left: 3px solid transparent; }
        .sidebar .menu-item:hover { background: #1e293b; color: #e2e8f0; }
        .sidebar .menu-item.active { background: #1e293b; color: white; border-left-color: #3b82f6; }
        .sidebar .menu-item .icon { font-size: 18px; width: 24px; text-align: center; }
        .main-content { flex: 1; padding: 24px 32px; overflow-y: auto; min-width: 0; max-height: 100vh; }
        .main-content h1 { font-size: 24px; margin-bottom: 20px; color: #0f172a; position: sticky; top: 0; background: #f1f5f9; z-index: 5; padding: 4px 0 12px 0; }
        .card { background: white; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
        .card .card-body { padding: 0 20px 20px 20px; }
        .toolbar { position: sticky; top: 0; background: white; z-index: 10; padding: 12px 20px; border-bottom: 1px solid #e5e7eb; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .toolbar .left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; }
        .toolbar .right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .toolbar input, .toolbar select { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: white; }
        .toolbar input { flex: 1; min-width: 140px; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; white-space: nowrap; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-success { background: #16a34a; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
        .btn-sm { padding: 4px 10px; font-size: 13px; }
        .btn:hover { opacity: 0.85; }
        .status { margin-top: 8px; font-size: 14px; padding: 6px 12px; border-radius: 6px; display: none; }
        .status.success { background: #dcfce7; color: #166534; display: block; }
        .status.error { background: #fee2e2; color: #991b1b; display: block; }
        .status.loading { background: #fef9c3; color: #854d0e; display: block; }
        .status.info { background: #dbeafe; color: #1e40af; display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 8px; background: #f1f5f9; border-bottom: 2px solid #d1d5db; position: sticky; top: 0; }
        td { padding: 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .table-wrap { max-height: 540px; overflow-y: auto; }
        .pagination-wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 12px 8px 4px 8px; border-top: 1px solid #e5e7eb; margin-top: 8px; font-size: 14px; color: #475569; }
        .pagination-wrap .pages { display: flex; gap: 4px; align-items: center; }
        .pagination-wrap .pages button { min-width: 32px; height: 32px; padding: 0 6px; border: 1px solid #d1d5db; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; font-weight: 500; color: #1f2937; transition: 0.15s; }
        .pagination-wrap .pages button.active { background: #2563eb; color: white; border-color: #2563eb; }
        .pagination-wrap .pages button:disabled { opacity: 0.4; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; padding: 24px; border-radius: 16px; max-width: 700px; width: 92%; max-height: 85vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .form-group textarea { min-height: 60px; font-family: inherit; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        .ing-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
        .ing-row input.ing-name { flex: 2; min-width: 100px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        .ing-row input.ing-grams { flex: 1; min-width: 60px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; width: 80px; }
        .ing-row .btn { flex-shrink: 0; }
        .add-ing-btn { margin-top: 4px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .config-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
        .config-row .field { flex: 1; min-width: 150px; }
        .config-row .field label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .config-row .field input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .config-status-box { margin-top: 16px; padding: 16px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
        .config-status-box .label { font-size: 12px; color: #64748b; }
        .tip-box { margin-top: 16px; padding: 12px; background: #fef9c3; border-radius: 8px; font-size: 13px; color: #854d0e; }
        .json-toggle { cursor: pointer; color: #2563eb; font-weight: 600; font-size: 14px; user-select: none; }
        .json-toggle:hover { text-decoration: underline; }
        .json-area { margin-top: 8px; display: none; }
        .json-area.open { display: block; }
        .json-area textarea { width: 100%; font-family: monospace; font-size: 13px; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px; min-height: 120px; }
        .json-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; padding: 12px 0; }
            .sidebar .brand { font-size: 14px; padding: 0 12px 16px 12px; text-align: center; }
            .sidebar .menu-item { padding: 12px; justify-content: center; }
            .sidebar .menu-item span:not(.icon) { display: none; }
            .main-content { padding: 16px; }
            .toolbar { padding: 10px 14px; flex-direction: column; align-items: stretch; }
            .pagination-wrap { flex-direction: column; gap: 8px; align-items: stretch; text-align: center; }
            .pagination-wrap .pages { justify-content: center; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">⚙️ 运营后台</div>
        <nav>
            <div class="menu-item active" data-tab="recipes"><span class="icon">📝</span><span>菜谱管理</span></div>
            <div class="menu-item" data-tab="ingredients"><span class="icon">🥬</span><span>食材管理</span></div>
            <div class="menu-item" data-tab="categories"><span class="icon">📂</span><span>分类管理</span></div>
            <div class="menu-item" data-tab="nutrition"><span class="icon">🍎</span><span>营养数据</span></div>
            <div class="menu-item" data-tab="other"><span class="icon">🔧</span><span>其他数据</span></div>
            <div class="menu-item" data-tab="config"><span class="icon">⚙️</span><span>GitHub 配置</span></div>
        </nav>
        <div style="margin-top:auto;padding:16px 20px;border-top:1px solid #1e293b;font-size:12px;color:#64748b;">v2.0 · 每页10条</div>
    </aside>

    <main class="main-content">
        <h1 id="pageTitle">📝 菜谱管理</h1>

        <!-- 菜谱管理 -->
        <div id="tab-recipes" class="tab-content active">
            <div class="card">
                <div class="toolbar">
                    <div class="left">
                        <input type="text" id="recipeSearch" placeholder="搜索菜谱名称..." oninput="filterRecipes()">
                        <select id="recipeCategoryFilter" onchange="filterRecipes()"><option value="">全部分类</option></select>
                    </div>
                    <div class="right">
                        <button class="btn btn-primary" onclick="openRecipeModal()">+ 新增菜谱</button>
                        <button class="btn btn-success" onclick="saveRecipes()">💾 保存</button>
                        <button class="btn btn-secondary" onclick="loadRecipes()">🔄 加载</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="recipesStatus" class="status"></div>
                    <div class="table-wrap" id="recipeTableContainer"><p style="color:#6b7280;">点击“加载”查看数据</p></div>
                    <div id="recipePagination" class="pagination-wrap"></div>
                </div>
            </div>
        </div>

        <!-- 食材管理 -->
        <div id="tab-ingredients" class="tab-content">
            <div class="card">
                <div class="toolbar">
                    <div class="left">
                        <input type="text" id="ingSearch" placeholder="搜索食材..." oninput="filterIngredients()">
                        <select id="ingCategoryFilter" onchange="filterIngredients()"><option value="">全部分类</option></select>
                    </div>
                    <div class="right">
                        <button class="btn btn-primary" onclick="openIngredientModal()">+ 新增食材</button>
                        <button class="btn btn-success" onclick="saveIngredients()">💾 保存</button>
                        <button class="btn btn-secondary" onclick="loadIngredients()">🔄 加载</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="ingredientsStatus" class="status"></div>
                    <div class="table-wrap" id="ingredientTableContainer"><p style="color:#6b7280;">点击“加载”查看数据</p></div>
                    <div id="ingredientPagination" class="pagination-wrap"></div>
                </div>
            </div>
        </div>

        <!-- 分类管理 -->
        <div id="tab-categories" class="tab-content">
            <div class="card">
                <div class="toolbar">
                    <div class="left">
                        <input type="text" id="newCatName" placeholder="分类名称" style="flex:1;min-width:100px;">
                        <input type="text" id="newCatEmoji" placeholder="图标" style="width:80px;">
                        <button class="btn btn-primary" onclick="addCategory()">添加</button>
                    </div>
                    <div class="right">
                        <button class="btn btn-success" onclick="saveCategories()">💾 保存</button>
                        <button class="btn btn-secondary" onclick="loadCategories()">🔄 加载</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="categoriesStatus" class="status"></div>
                    <div class="table-wrap" id="categoryList"><p style="color:#6b7280;">点击“加载”查看</p></div>
                    <div id="categoryPagination" class="pagination-wrap"></div>
                </div>
            </div>
        </div>

        <!-- 营养数据 -->
        <div id="tab-nutrition" class="tab-content">
            <div class="card">
                <div class="toolbar">
                    <div class="left"><input type="text" id="nutriSearch" placeholder="搜索食材..." oninput="filterNutrition()"></div>
                    <div class="right">
                        <button class="btn btn-success" onclick="saveNutrition()">💾 保存</button>
                        <button class="btn btn-secondary" onclick="loadNutrition()">🔄 加载</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="nutritionStatus" class="status"></div>
                    <div class="table-wrap" id="nutritionTableContainer"><p style="color:#6b7280;">点击“加载”查看</p></div>
                    <div id="nutritionPagination" class="pagination-wrap"></div>
                </div>
            </div>
        </div>

        <!-- 其他数据 -->
        <div id="tab-other" class="tab-content">
            <div class="card">
                <div class="toolbar">
                    <div class="left"><button class="btn btn-secondary" onclick="loadOtherData()">📥 检查所有文件</button></div>
                    <div class="right"></div>
                </div>
                <div class="card-body">
                    <div id="otherDataContainer" style="margin-bottom:12px;"></div>
                    <hr style="margin:12px 0;border-color:#e5e7eb;">
                    <div><strong>📄 手动编辑 JSON</strong></div>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;">
                        <input type="text" id="otherFilePath" placeholder="如 data/calorie-table.json" style="flex:2;min-width:150px;padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;">
                        <button class="btn btn-secondary" onclick="loadOtherFile()">加载</button>
                        <button class="btn btn-success" onclick="saveOtherFile()">保存</button>
                    </div>
                    <textarea id="otherFileContent" rows="8" style="width:100%;font-family:monospace;font-size:13px;border:1px solid #d1d5db;border-radius:8px;padding:8px;"></textarea>
                    <div id="otherFileStatus" class="status"></div>
                </div>
            </div>
        </div>

        <!-- GitHub 配置 -->
        <div id="tab-config" class="tab-content">
            <div class="card">
                <div class="toolbar">
                    <div class="left"><strong style="font-size:15px;">🔐 GitHub 配置</strong></div>
                    <div class="right">
                        <button class="btn btn-primary" onclick="saveConfig()">💾 保存配置</button>
                        <button class="btn btn-secondary" onclick="loadConfig()">📂 加载配置</button>
                        <button class="btn btn-secondary" onclick="clearConfig()">🗑️ 清除</button>
                    </div>
                </div>
                <div class="card-body">
                    <p style="color:#64748b;font-size:14px;margin-bottom:16px;">
                        配置 GitHub 仓库信息，用于读取和保存基础数据文件。
                        Token 需要 <code style="background:#e5e7eb;padding:1px 6px;border-radius:4px;">repo</code> 权限。
                    </p>
                    <div class="config-row">
                        <div class="field"><label>Owner（用户名）</label><input type="text" id="owner" placeholder="你的GitHub用户名"></div>
                        <div class="field"><label>Repo（仓库名）</label><input type="text" id="repo" placeholder="你的仓库名"></div>
                        <div class="field"><label>Token（classic）</label><input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx"></div>
                    </div>
                    <div id="configStatus" class="status"></div>
                    <div class="config-status-box">
                        <div class="label">📌 当前配置状态</div>
                        <div id="configInfo" style="margin-top:6px;font-size:13px;color:#475569;">尚未配置</div>
                    </div>
                    <div class="tip-box">💡 <strong>提示：</strong>配置保存在浏览器本地（localStorage），不会上传到任何服务器。</div>
                    <div style="margin-top:16px;">
                        <button class="btn btn-secondary" onclick="testConnection()">🔄 测试 GitHub 连接</button>
                        <span id="testResult" style="font-size:14px;color:#64748b;margin-left:12px;"></span>
                        <div id="testStatus" class="status" style="margin-top:8px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== 菜谱模态框（已改造：食材输入+下拉建议，增加JSON导入导出） ===== -->
    <div class="modal-overlay" id="recipeModal">
        <div class="modal">
            <h2 id="recipeModalTitle">新增菜谱</h2>
            <!-- 基础表单 -->
            <div class="form-group"><label>菜谱名称</label><input type="text" id="editRecipeName"></div>
            <div class="form-group"><label>分类</label><input type="text" id="editRecipeCat" placeholder="如：家常菜"></div>
            <div class="form-group"><label>难度</label><select id="editRecipeDiff"><option value="简单">简单</option><option value="中等" selected>中等</option><option value="困难">困难</option></select></div>
            <div class="form-group"><label>烹饪时间</label><input type="text" id="editRecipeTime" placeholder="如：10分钟"></div>
            <div class="form-group">
                <label>所需食材（输入名称，自动匹配下拉）</label>
                <!-- datalist 用于提供下拉建议 -->
                <datalist id="ingredientDatalist"></datalist>
                <div id="editRecipeIngredientsContainer"></div>
                <button class="btn btn-secondary btn-sm add-ing-btn" onclick="addIngredientRow()">+ 添加食材</button>
            </div>
            <div class="form-group"><label>步骤（每行一步）</label><textarea id="editRecipeSteps" rows="5"></textarea></div>

            <!-- JSON 导入/导出区域 -->
            <div style="margin-top:16px; border-top:1px solid #e5e7eb; padding-top:12px;">
                <span class="json-toggle" onclick="toggleJsonArea()">📋 JSON 导入/导出 (点击展开)</span>
                <div id="jsonArea" class="json-area">
                    <textarea id="recipeJsonInput" placeholder="粘贴 JSON 格式的菜谱数据..."></textarea>
                    <div class="json-actions">
                        <button class="btn btn-primary btn-sm" onclick="importRecipeJSON()">📥 导入并填充</button>
                        <button class="btn btn-secondary btn-sm" onclick="exportRecipeJSON()">📤 导出当前为 JSON</button>
                        <button class="btn btn-secondary btn-sm" onclick="clearJsonInput()">🗑️ 清空</button>
                    </div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeRecipeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveRecipeModal()">保存</button>
            </div>
        </div>
    </div>

    <!-- 食材模态框 -->
    <div class="modal-overlay" id="ingredientModal">
        <div class="modal">
            <h2 id="ingredientModalTitle">新增食材</h2>
            <div class="form-group"><label>食材名称</label><input type="text" id="editIngName"></div>
            <div class="form-group">
                <label>分类</label>
                <select id="editIngCat"><option value="">请选择分类（先加载分类）</option></select>
            </div>
            <div class="form-group"><label>单位</label><input type="text" id="editIngUnit" value="g"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeIngredientModal()">取消</button>
                <button class="btn btn-primary" onclick="saveIngredientModal()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 全局状态 ============
        let CONFIG = { owner: '', repo: '', token: '' };
        let recipes = [], recipesSha = null;
        let ingredients = [], ingredientsSha = null;
        let categories = {}, categorySha = null;
        let nutrition = {}, nutritionSha = null;
        let editRecipeIdx = -1, editIngIdx = -1;
        const PAGE_SIZE = 10;
        let recipePage = 1, ingPage = 1, catPage = 1, nutPage = 1;

        // ============ 菜单切换 ============
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById('tab-' + tab).classList.add('active');
                const titles = {
                    recipes: '📝 菜谱管理',
                    ingredients: '🥬 食材管理',
                    categories: '📂 分类管理',
                    nutrition: '🍎 营养数据',
                    other: '🔧 其他数据',
                    config: '⚙️ GitHub 配置'
                };
                document.getElementById('pageTitle').textContent = titles[tab] || '管理';
                if (tab === 'recipes') loadRecipes();
                else if (tab === 'ingredients') loadIngredients();
                else if (tab === 'categories') loadCategories();
                else if (tab === 'nutrition') loadNutrition();
                else if (tab === 'config') updateConfigInfo();
            });
        });

        // ============ 配置管理 ============
        function loadConfig() {
            const saved = localStorage.getItem('admin_github_config');
            if (saved) {
                try {
                    const cfg = JSON.parse(saved);
                    document.getElementById('owner').value = cfg.owner || '';
                    document.getElementById('repo').value = cfg.repo || '';
                    document.getElementById('token').value = cfg.token || '';
                    CONFIG = cfg;
                    showStatus('configStatus', '配置已加载 ✅', 'success');
                    updateConfigInfo();
                } catch (e) {}
            } else {
                showStatus('configStatus', '⚠️ 未找到已保存的配置', 'info');
            }
        }

        function saveConfig() {
            CONFIG.owner = document.getElementById('owner').value.trim();
            CONFIG.repo = document.getElementById('repo').value.trim();
            let token = document.getElementById('token').value.trim();
            token = token.replace(/[^A-Za-z0-9_\-]/g, '');
            CONFIG.token = token;
            if (!CONFIG.owner || !CONFIG.repo || !CONFIG.token) {
                showStatus('configStatus', '❌ 请完整填写配置', 'error');
                return;
            }
            localStorage.setItem('admin_github_config', JSON.stringify(CONFIG));
            showStatus('configStatus', '✅ 配置已保存到本地', 'success');
            updateConfigInfo();
        }

        function clearConfig() {
            if (!confirm('确定清除所有配置吗？')) return;
            localStorage.removeItem('admin_github_config');
            document.getElementById('owner').value = '';
            document.getElementById('repo').value = '';
            document.getElementById('token').value = '';
            CONFIG = { owner: '', repo: '', token: '' };
            showStatus('configStatus', '🗑️ 配置已清除', 'info');
            updateConfigInfo();
        }

        function updateConfigInfo() {
            const el = document.getElementById('configInfo');
            const cfg = getConfigSilent();
            if (cfg && cfg.owner && cfg.repo) {
                el.innerHTML =
                    `<div style="display:flex;flex-wrap:wrap;gap:16px;">
                        <span>👤 <strong>Owner:</strong> ${cfg.owner}</span>
                        <span>📦 <strong>Repo:</strong> ${cfg.repo}</span>
                        <span>🔑 <strong>Token:</strong> ${cfg.token ? '已设置 (' + cfg.token.slice(0,8) + '••••••)' : '未设置'}</span>
                        <span style="color:#16a34a;">✅ 配置有效</span>
                    </div>`;
            } else {
                el.innerHTML = '<span style="color:#dc2626;">⚠️ 配置不完整，请填写所有字段并保存</span>';
            }
        }

        function getConfigSilent() {
            const o = document.getElementById('owner').value.trim();
            const r = document.getElementById('repo').value.trim();
            let t = document.getElementById('token').value.trim();

        // ============ GitHub API ============
        async function readGitHubFile(path) {
            const cfg = getConfig();
            if (!cfg) throw new Error('配置无效');
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
            const res = await fetch(url, {
                headers: { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!res.ok) {
                if (res.status === 404) return null;
                throw new Error(`读取失败 (${res.status}): ${res.statusText}`);
            }
            const data = await res.json();
            const binary = atob(data.content);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const content = new TextDecoder('utf-8').decode(bytes);
            return { content: JSON.parse(content), sha: data.sha };
        }

        async function writeGitHubFile(path, jsonData, sha) {
            const cfg = getConfig();
            if (!cfg) throw new Error('配置无效');
            const jsonString = JSON.stringify(jsonData, null, 2);
            const utf8Bytes = new TextEncoder().encode(jsonString);
            let binary = '';
            for (let i = 0; i < utf8Bytes.length; i++) binary += String.fromCharCode(utf8Bytes[i]);
            const content = btoa(binary);
            const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: `运营后台更新: ${path}`,
                    content: content,
                    sha: sha
                })
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(`写入失败 (${res.status}): ${err.message || res.statusText}`);
            }
            return res.json();
        }

        function renderPagination(containerId, total, currentPage, pageSize, onPageChange) {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (total === 0) { container.innerHTML = `<span class="info">共 0 条</span>`; return; }
            const totalPages = Math.ceil(total / pageSize);
            if (totalPages <= 1) { container.innerHTML = `<span class="info">共 ${total} 条</span>`; return; }
            let html = `<span class="info">共 ${total} 条，第 ${currentPage}/${totalPages} 页</span><div class="pages">`;
            html +=
                `<button onclick="changePage(${currentPage - 1}, '${containerId}', ${total}, '${onPageChange}')" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);
            if (startPage > 1) {
                html += `<button onclick="changePage(1, '${containerId}', ${total}, '${onPageChange}')">1</button>`;
                if (startPage > 2) html += `<span class="ellipsis">…</span>`;
            }
            for (let i = startPage; i <= endPage; i++) {
                html +=
                    `<button class="${i === currentPage ? 'active' : ''}" onclick="changePage(${i}, '${containerId}', ${total}, '${onPageChange}')">${i}</button>`;
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<span class="ellipsis">…</span>`;
                html +=
                    `<button onclick="changePage(${totalPages}, '${containerId}', ${total}, '${onPageChange}')">${totalPages}</button>`;
            }
            html +=
                `<button onclick="changePage(${currentPage + 1}, '${containerId}', ${total}, '${onPageChange}')" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `</div>`;
            container.innerHTML = html;
        }

        function changePage(page, containerId, total, callbackName) {
            const totalPages = Math.ceil(total / PAGE_SIZE);
            if (page < 1 || page > totalPages) return;
            if (containerId === 'recipePagination') recipePage = page;
            else if (containerId === 'ingredientPagination') ingPage = page;
            else if (containerId === 'categoryPagination') catPage = page;
            else if (containerId === 'nutritionPagination') nutPage = page;
            if (callbackName === 'renderRecipes') renderRecipes();
            else if (callbackName === 'renderIngredients') renderIngredients();
            else if (callbackName === 'renderCategories') renderCategories();
            else if (callbackName === 'renderNutrition') renderNutrition();
        }

            pageData.forEach(([name, emoji]) => {
                html +=
                    `<tr><td>${name}</td><td>${emoji||'📦'}</td><td class="actions"><button class="btn btn-danger btn-sm" onclick="deleteCategory('${name}')">删除</button></td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            renderPagination('categoryPagination', total, catPage, PAGE_SIZE, 'renderCategories');
        }

        function addCategory() {
            const name = document.getElementById('newCatName').value.trim();
            const emoji = document.getElementById('newCatEmoji').value.trim() || '📦';
            if (!name) { alert('请输入分类名称'); return; }
            if (categories[name]) { alert('已存在'); return; }
            categories[name] = emoji;
            document.getElementById('newCatName').value = '';
            document.getElementById('newCatEmoji').value = '';
            const total = Object.keys(categories).length;
            catPage = Math.ceil(total / PAGE_SIZE);
            renderCategories();
            populateCategorySelect(name);
            showStatus('categoriesStatus', '📝 已添加', '');
        }

        function deleteCategory(name) {
            if (!confirm('确定删除？')) return;
            delete categories[name];
            renderCategories();
            populateCategorySelect('');
            showStatus('categoriesStatus', '🗑️ 已删除', '');
        }

        async function saveCategories() {
            if (!getConfig()) return;
            showStatus('categoriesStatus', '⏳ 保存中...', 'loading');
            try {
                const r = await writeGitHubFile('data/categories.json', categories, categorySha);
                categorySha = r.content.sha;
                showStatus('categoriesStatus', '✅ 保存成功', 'success');
            } catch (e) { showStatus('categoriesStatus', '❌ ' + e.message, 'error'); }
        }

        // ============ 营养数据 ============
        async function loadNutrition() {
            nutPage = 1;
            showStatus('nutritionStatus', '⏳ 加载中...', 'loading');
            try {
                const r = await readGitHubFile('data/nutrition-table.json');
                if (!r) { nutrition = {};
                    nutritionSha = null;
                    showStatus('nutritionStatus', '⚠️ 文件不存在', 'error'); } else { nutrition = r.content;
                    nutritionSha = r.sha;
                    showStatus('nutritionStatus', `✅ 共 ${Object.keys(nutrition).length} 条`, 'success'); }
                renderNutrition();
            } catch (e) { showStatus('nutritionStatus', '❌ ' + e.message, 'error'); }
        }

        function renderNutrition() {
            const container = document.getElementById('nutritionTableContainer');
            const search = document.getElementById('nutriSearch').value.toLowerCase();
            const entries = Object.entries(nutrition).filter(([k]) => k.toLowerCase().includes(search));
            const total = entries.length;
            const start = (nutPage - 1) * PAGE_SIZE;
            const pageData = entries.slice(start, start + PAGE_SIZE);
            if (!pageData.length) { container.innerHTML = '<p style="color:#6b7280;">无数据</p>';
                renderPagination('nutritionPagination', total, nutPage, PAGE_SIZE, 'renderNutrition'); return; }
            let html =
                `<table><thead><tr><th>食材</th><th>热量</th><th>碳水</th><th>蛋白质</th><th>脂肪</th><th>操作</th></tr></thead><tbody>`;
            pageData.forEach(([name, data]) => {
                html +=
                    `<tr><td><strong>${name}</strong></td><td>${data.cal||0}</td><td>${data.carb||0}</td><td>${data.prot||0}</td><td>${data.fat||0}</td>
                            <td class="actions"><button class="btn btn-danger btn-sm" onclick="deleteNutrition('${name}')">删除</button></td></tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
            renderPagination('nutritionPagination', total, nutPage, PAGE_SIZE, 'renderNutrition');
        }

        function filterNutrition() { nutPage = 1;
            renderNutrition(); }

        function deleteNutrition(name) {
            if (!confirm('确定删除？')) return;
            delete nutrition[name];
            renderNutrition();
            showStatus('nutritionStatus', '🗑️ 已删除', '');
        }

        async function saveNutrition() {
            if (!getConfig()) return;
            showStatus('nutritionStatus', '⏳ 保存中...', 'loading');
            try {
                const r = await writeGitHubFile('data/nutrition-table.json', nutrition, nutritionSha);
                nutritionSha = r.content.sha;
                showStatus('nutritionStatus', '✅ 保存成功', 'success');
            } catch (e) { showStatus('nutritionStatus', '❌ ' + e.message, 'error'); }
        }

        // ============ 其他数据 ============
        async function loadOtherData() {
            const container = document.getElementById('otherDataContainer');
            container.innerHTML = '⏳ 加载中...';
            const files = ['categories.json', 'calorie-table.json', 'nutrition-table.json', 'category-defaults.json',
                'ingredient-units.json'
            ];
            let html = '';
            for (const f of files) {
                try {
                    const r = await readGitHubFile(`data/${f}`);
                    html += `<div><strong>${f}</strong> ${r ? '✅ 存在' : '❌ 不存在'}</div>`;
                } catch (e) { html += `<div><strong>${f}</strong> ❌ 读取失败</div>`; }
            }
            container.innerHTML = html || '无数据';
        }

        async function loadOtherFile() {
            const path = document.getElementById('otherFilePath').value.trim();
            if (!path) { alert('请输入路径'); return; }
            showStatus('otherFileStatus', '⏳ 加载中...', 'loading');
            try {
                const r = await readGitHubFile(path);
                if (!r) {
                    document.getElementById('otherFileContent').value = '';
                    showStatus('otherFileStatus', '⚠️ 文件不存在', 'error');
                } else {
                    document.getElementById('otherFileContent').value = JSON.stringify(r.content, null, 2);
                    showStatus('otherFileStatus', '✅ 加载成功', 'success');
                }
            } catch (e) { showStatus('otherFileStatus', '❌ ' + e.message, 'error'); }
        }

        async function saveOtherFile() {
            if (!getConfig()) return;
            const path = document.getElementById('otherFilePath').value.trim();
            if (!path) { alert('请输入路径'); return; }
            let jsonData;
            try { jsonData = JSON.parse(document.getElementById('otherFileContent').value); } catch (e) { alert(
                    'JSON 格式错误'); return; }
            showStatus('otherFileStatus', '⏳ 保存中...', 'loading');
            try {
                let sha = null;
                try { const existing = await readGitHubFile(path); if (existing) sha = existing.sha; } catch (e) {}
                const r = await writeGitHubFile(path, jsonData, sha);
                showStatus('otherFileStatus', '✅ 保存成功', 'success');
            } catch (e) { showStatus('otherFileStatus', '❌ ' + e.message, 'error'); }
        }

        // ============ 初始化 ============
        window.onload = function() {
            loadConfig();
            loadRecipes();
            loadIngredients();
            loadCategories();
            // 初始化 datalist
            updateDatalist();
        };
    </script>
</body>
</html>
